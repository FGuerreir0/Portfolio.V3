<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary meta. %SITE_URL% is filled in at build time (see vite.config.js). -->
    <title>Fábio Guerreiro — Full Stack Developer in Portugal</title>
    <meta name="description" content="Full Stack Developer in Lisbon, 5+ years at Trading Economics. React, Node.js, TypeScript and supply-chain security research credited by Lovable on HackerOne.">
    <meta name="author" content="Fábio Guerreiro">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="%SITE_URL%/">

    <!-- Languages: the same page, switched with ?lang= -->
    <link rel="alternate" hreflang="en" href="%SITE_URL%/">
    <link rel="alternate" hreflang="pt" href="%SITE_URL%/?lang=pt">
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%/">

    <!-- Open Graph -->
    <meta property="og:type" content="profile">
    <meta property="og:url" content="%SITE_URL%/">
    <meta property="og:site_name" content="Fábio Guerreiro">
    <meta property="og:title" content="Fábio Guerreiro — Full Stack Developer in Portugal">
    <meta property="og:description" content="5+ years shipping production software at Trading Economics. Web platforms, developer tools and supply-chain security research.">
    <meta property="og:image" content="%SITE_URL%/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Fábio Guerreiro, Full Stack Developer">
    <meta property="og:locale" content="en_GB">
    <meta property="og:locale:alternate" content="pt_PT">
    <meta property="profile:first_name" content="Fábio">
    <meta property="profile:last_name" content="Guerreiro">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fábio Guerreiro — Full Stack Developer in Portugal">
    <meta name="twitter:description" content="5+ years shipping production software at Trading Economics. Web platforms, developer tools and supply-chain security research.">
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg">
    <meta name="twitter:image:alt" content="Fábio Guerreiro, Full Stack Developer">

    <!-- Icons & app -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FAFAF8">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">

    <!-- Structured data: a profile page about one person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "%SITE_URL%/#website",
          "url": "%SITE_URL%/",
          "name": "Fábio Guerreiro",
          "inLanguage": ["en", "pt-PT"]
        },
        {
          "@type": "ProfilePage",
          "@id": "%SITE_URL%/#profile",
          "url": "%SITE_URL%/",
          "isPartOf": { "@id": "%SITE_URL%/#website" },
          "mainEntity": { "@id": "%SITE_URL%/#person" }
        },
        {
          "@type": "Person",
          "@id": "%SITE_URL%/#person",
          "name": "Fábio Guerreiro",
          "url": "%SITE_URL%/",
          "image": "%SITE_URL%/images/portrait.webp",
          "jobTitle": "Full Stack Developer",
          "description": "Full Stack Developer in Lisbon with over five years of production experience at Trading Economics.",
          "worksFor": { "@type": "Organization", "name": "Trading Economics", "url": "https://tradingeconomics.com" },
          "address": { "@type": "PostalAddress", "addressLocality": "Lisbon", "addressCountry": "PT" },
          "nationality": { "@type": "Country", "name": "Portugal" },
          "knowsLanguage": ["pt", "en"],
          "alumniOf": [
            { "@type": "EducationalOrganization", "name": "Ironhack" },
            { "@type": "CollegeOrUniversity", "name": "Instituto Piaget" },
            { "@type": "EducationalOrganization", "name": "Conservatório Regional de Setúbal" }
          ],
          "award": "Lovable Vulnerability Disclosure Program, HackerOne thanks page (2026)",
          "knowsAbout": [
            "Full Stack Development", "React", "Next.js", "Vue.js", "Node.js", "TypeScript",
            "JavaScript", "Python", "Supabase", "Supply-chain Security", "npm", "Model Context Protocol"
          ],
          "sameAs": [
            "https://github.com/FGuerreir0",
            "https://www.linkedin.com/in/fabiofsguerreiro/",
            "https://www.npmjs.com/package/ghostimport",
            "https://www.twitch.tv/fabio_guerreiro",
            "https://www.youtube.com/@fabiopguerreiro",
            "https://www.instagram.com/fguerreir0/"
          ]
        },
        {
          "@type": "SoftwareSourceCode",
          "name": "ghostimport",
          "description": "Detects imports of npm packages that don't exist, the names AI coding tools make up.",
          "codeRepository": "https://github.com/FGuerreir0/ghostimport",
          "programmingLanguage": "TypeScript",
          "license": "https://opensource.org/licenses/MIT",
          "author": { "@id": "%SITE_URL%/#person" }
        }
      ]
    }
    </script>
</head>
<body>
    <div id="root"></div>
    <!-- Shown to crawlers and visitors without JavaScript -->
    <noscript>
        <h1>Fábio Guerreiro — Full Stack Developer</h1>
        <p>Full Stack Developer in Lisbon with over five years at Trading Economics. Author of ghostimport, an npm tool that catches AI-hallucinated imports, credited by Lovable on HackerOne in 2026.</p>
        <p><a href="https://github.com/FGuerreir0">GitHub</a> · <a href="https://www.linkedin.com/in/fabiofsguerreiro/">LinkedIn</a></p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
